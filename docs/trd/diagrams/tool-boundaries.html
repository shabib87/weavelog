<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool boundaries — loop positions</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Tool boundaries — where each tool sits in the loop</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="toolboundaries-title toolboundaries-desc">
      <title id="toolboundaries-title">Tool loop positions</title>
      <desc id="toolboundaries-desc">Architecture diagram placing the six harness tools on the WHY/WHAT/HOW phase flow: backlog.md as the queue feeding all phases, opencode as the runtime hosting them, enforce and worktree-create and reviewer-loop as HOW-phase guardrails, and headroom as an infrastructure layer under everything.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: HOW inner loop (guardrails) -->
      <rect x="416" y="88" width="544" height="264" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="600" y="92" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="688" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">HOW — INNER-LOOP GUARDRAILS</text>

      <!-- Zone: Infrastructure (full width, bottom) -->
      <rect x="32" y="424" width="928" height="120" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="432" y="428" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="437" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">INFRASTRUCTURE — ALL TRAFFIC</text>

      <!-- Phase band labels (left gutter) -->
      <text x="48" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHY/WHAT</text>
      <text x="48" y="136" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace">intake + dialogue</text>

      <!-- Arrows first -->
      <!-- backlog queue feeds the runtime (primary flow, coral) -->
      <line x1="256" y1="200" x2="308" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- opencode hosts HOW tools: fan out from opencode right edge into the HOW zone -->
      <path d="M 444,200 H 464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- headroom underlies opencode: opencode bottom -> headroom top -->
      <path d="M 380,248 V 456"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <!-- reviewer-loop verdict feeds the human merge gate -->
      <path d="M 768,228 H 808" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="260" y="180" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="284" y="189" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FEEDS</text>

      <rect x="392" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="301" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>

      <rect x="770" y="206" width="36" height="12" rx="2" fill="#f5f5f5"/>

      <!-- Node: backlog.md (queue, focal) -->
      <rect x="96" y="152" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="152" width="160" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="104" y="160" width="48" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8" opacity="0.55"/>
      <text x="128" y="169" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
      <text x="176" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">backlog.md</text>
      <text x="176" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task ledger · kanban</text>
      <text x="176" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">feeds all phases</text>

      <!-- Node: opencode (runtime, hosts everything) -->
      <rect x="308" y="152" width="136" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="316" y="160" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="344" y="169" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
      <text x="376" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">opencode</text>
      <text x="376" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">conductor + subagents</text>
      <text x="376" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">all phases run inside</text>

      <!-- HOW zone nodes -->
      <!-- enforce.ts -->
      <rect x="464" y="128" width="144" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="472" y="136" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="500" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLUGIN</text>
      <text x="536" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">enforce.ts</text>
      <text x="536" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">write-block · gates</text>
      <text x="536" y="198" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fail-open · stateless</text>

      <!-- worktree-create.ts -->
      <rect x="464" y="240" width="144" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="472" y="248" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="500" y="257" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
      <text x="536" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worktree-create</text>
      <text x="536" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.worktrees/&lt;task-id&gt;</text>
      <text x="536" y="310" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">isolation per task</text>

      <!-- reviewer-loop.ts -->
      <rect x="632" y="184" width="136" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="190" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="668" y="199" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE 3</text>
      <text x="700" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">reviewer-loop</text>
      <text x="700" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cross-model review</text>
      <text x="700" y="254" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">budget-capped · --exclude</text>

      <!-- human merge gate (outer loop) -->
      <rect x="808" y="184" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="816" y="192" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="848" y="201" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN GATE</text>
      <text x="872" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">merge approval</text>
      <text x="872" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outer loop · HITL</text>
      <text x="872" y="254" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">conductor never merges</text>

      <!-- Infrastructure nodes -->
      <!-- headroom -->
      <rect x="352" y="456" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="440" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">headroom proxy</text>
      <text x="440" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:8788</text>
      <text x="440" y="500" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cache · compress · /health</text>

      <!-- conductor note (external-style, top right of infra) -->
      <rect x="672" y="456" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="792" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">everything else is state</text>
      <text x="792" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backlog ledger · git · worktrees</text>

      <!-- Legend -->
      <line x1="32" y1="576" x2="960" y2="576" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="586" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="132" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL (queue)</text>
      <rect x="260" y="586" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
      <text x="280" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RUNTIME / TOOL</text>
      <rect x="424" y="586" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="444" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INFRASTRUCTURE</text>
      <rect x="600" y="586" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,3"/>
      <text x="620" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STATE / EXTERNAL</text>
      <line x1="776" y1="592" x2="816" y2="592" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="824" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INFRA CALL</text>
    </svg>
  </div>
</body>
</html>
