<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop factory · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Loop factory — three phases × two loop roles</h1>

    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loopfactory-title loopfactory-desc">
      <title id="loopfactory-title">Loop factory model — three phases and two loop roles</title>
      <desc id="loopfactory-desc">Architecture diagram showing work flowing from a backlog queue through three phases (WHY, WHAT, HOW) with two gates in HOW, and a single inner/outer boundary marked by evidence separating human decision ownership from the agent execution cycle.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (before arrows and nodes) -->
      <rect x="100" y="120" width="800" height="192" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="380" y="128" width="240" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="137" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">OUTER LOOP · HUMAN DECISION OWNERSHIP</text>

      <rect x="100" y="360" width="800" height="152" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="430" y="368" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="377" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">INNER LOOP · AGENT EXECUTION CYCLE</text>

      <!-- Inner/outer boundary (drawn with zones) -->
      <line x1="100" y1="336" x2="900" y2="336" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="360" y="322" width="280" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="331" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">EVIDENCE · ONE BOUNDARY ACROSS ALL PHASES</text>

      <!-- Arrows first (behind boxes) -->
      <path d="M 500,84 V 112 H 228 Q 220,112 220,120 V 160"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="196" x2="400" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="196" x2="680" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="780" y1="232" x2="780" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="780" y1="276" x2="780" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 780,312 V 400" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 720,456 V 488 H 840 V 456" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="228" y="124" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="133" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INTAKE</text>

      <rect x="336" y="176" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="362" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESEARCH</text>

      <rect x="616" y="176" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>

      <rect x="792" y="344" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="824" y="353" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTHORIZE</text>

      <rect x="764" y="468" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="786" y="477" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPEAT</text>

      <!-- Node: Queue (focal coral) -->
      <rect x="416" y="36" width="168" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="36" width="168" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="424" y="44" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="442" y="53" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
      <text x="500" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">backlog.md</text>
      <text x="500" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one task = one bounded goal</text>

      <!-- Node: WHY -->
      <rect x="120" y="160" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="160" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="148" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PHASE</text>
      <text x="220" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WHY</text>
      <text x="220" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">research → understanding</text>

      <!-- Node: WHAT -->
      <rect x="400" y="160" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="160" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="428" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PHASE</text>
      <text x="500" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WHAT</text>
      <text x="500" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spec · dialogue, not a gate</text>

      <!-- Node: HOW -->
      <rect x="680" y="160" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="160" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="708" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PHASE</text>
      <text x="780" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HOW</text>
      <text x="780" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan → build → verify</text>

      <!-- Node: Plan approval -->
      <rect x="680" y="248" width="200" height="28" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="248" width="200" height="28" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="702" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="800" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plan approval</text>

      <!-- Node: Merge approval -->
      <rect x="680" y="284" width="200" height="28" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="284" width="200" height="28" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="292" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="702" y="301" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="800" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merge approval</text>

      <!-- Node: Inner loop cycle -->
      <rect x="680" y="400" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="400" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="688" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="702" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="780" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">investigate → implement → verify</text>
      <text x="780" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repeat until verified</text>

      <!-- Legend strip -->
      <line x1="100" y1="536" x2="900" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="100" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="100" y="560" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="120" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / queue</text>

      <rect x="260" y="560" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Phase / gate</text>

      <rect x="420" y="560" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="440" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inner-loop state</text>

      <line x1="600" y1="566" x2="628" y2="566" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-accent)"/>
      <text x="636" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inner/outer boundary (evidence)</text>

      <line x1="840" y1="566" x2="868" y2="566" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="876" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / repeat</text>
    </svg>
  </div>
</body>
</html>
