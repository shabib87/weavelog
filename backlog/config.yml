project_name: "agents-harness"
default_status: "To Do"
statuses: ["To Do", "In Progress", "In Review", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "code"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"

definition_of_done:
  - "Tests and lint pass with fresh output in the worktree"
  - "Worktree is clean (no uncommitted changes)"
  - "Branch is rebased on main and green"
  - "All acceptance criteria checked with fresh evidence (one at a time, never batched)"
