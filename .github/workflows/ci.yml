name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly drift scan: surfaces new advisories and semgrep ruleset findings.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # Reproducible install. package.json pins the lockfile producer
      # (packageManager: npm@10.9.8); the tag-publish job uses a newer npm
      # only because OIDC trusted publishing needs >=11.5.1.
      - run: npm ci
      - run: npx biome check
      - run: npx tsc --noEmit
      - name: Tests
        run: node --import tsx --test "tests/**/*.test.ts"
      - name: Build dist
        run: |
          npm run build
          test -f dist/cli/index.js
      - name: Pack check (fresh build, dist, payload, no backlog)
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node --import tsx src/tools/pack-check.ts "$RUNNER_TEMP/pack.json"
      - name: Audit gate (production high/critical advisories)
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node --import tsx src/tools/audit-gate.ts "$RUNNER_TEMP/audit.json" .github/audit-exceptions.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - name: semgrep (uv-pinned, ruleset pinned, metrics off, error mode)
        run: |
          git clone --filter=blob:none https://github.com/semgrep/semgrep-rules.git "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout 311ca4e9ba59d700624539bf658e3d29b134ee77
          uv tool install "semgrep==1.177.0"
          export PATH="$HOME/.local/bin:$PATH"
          # Rules come from the commit-pinned semgrep-rules clone. This is a
          # deliberately narrow starting gate: several JavaScript rules produce
          # false positives on weavelog's intentional internal process
          # spawning, string building, and dynamic regexes, and their triage is
          # deferred to a follow-up task. The security rules below are pinned by
          # file.
          semgrep scan \
            --config "$RUNNER_TEMP/semgrep-rules/typescript/lang/security" \
            --config "$RUNNER_TEMP/semgrep-rules/generic/secrets" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/detect-eval-with-expression.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/detect-insecure-websocket.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/detect-non-literal-require.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/detect-pseudoRandomBytes.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/insecure-object-assign.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/spawn-git-clone.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/detect-disable-mustache-escape.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/detect-no-csrf-before-method-override.yaml" \
            --config "$RUNNER_TEMP/semgrep-rules/javascript/lang/security/detect-buffer-noassert.yaml" \
            --metrics=off --error
      - name: Skill frontmatter license/upstream check
        run: |
          missing=""
          while IFS= read -r f; do
            grep -q '^license:' "$f" || missing="$missing$f (license)\n"
            grep -q '^upstream:' "$f" || missing="$missing$f (upstream)\n"
          done < <(find payload/skills -name 'SKILL.md')
          if [ -n "$missing" ]; then echo "Missing frontmatter fields:"; printf "$missing"; exit 1; fi