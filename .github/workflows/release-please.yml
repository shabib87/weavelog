name: Release Please

# Prepares releases from Conventional Commits. A normal push only opens or
# updates the release PR (`skip-github-release: true`), so no tag or GitHub
# Release is created automatically. The tag is created only by the manually
# dispatched `github-release` job, which runs the publish gate first and then
# dispatches the gated publish workflow. See ADR-0009.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          release-type: node
          skip-github-release: true

  github-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch the publish workflow
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - name: Publish gate (closure set + human marker) before any tag
        run: node --import tsx src/tools/publish-gate.ts backlog/tasks
        env:
          WEAVELOG_PUBLISH_APPROVED: ${{ vars.WEAVELOG_PUBLISH_APPROVED }}
      - name: Create the GitHub release and tag
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          release-type: node
          skip-github-pull-request: true
      # A release created with GITHUB_TOKEN does not trigger `on: release`, so
      # dispatch the gated publish workflow explicitly (workflow_dispatch is the
      # documented exception to that suppression).
      - name: Dispatch the gated publish workflow
        run: gh workflow run publish.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}